<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ガチキャリア | ドライバー採用LP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="lp">
    <section class="fv image-section">
      <img src="assets/fv.svg" alt="ガチキャリア ファーストビュー" />
    </section>

    <section class="issues">
      <img src="assets/issues.svg" alt="採用課題に悩む企業イメージ" />
    </section>

    <section class="cta-card">
      <img src="assets/cta.svg" alt="最短3日で最大の採用数" />
    </section>

    <section class="form-section" id="diagnosis">
      <h2>診断フォーム</h2>

      <div class="question">
        <p><span class="q-number">1</span>現在使っている採用方法</p>
        <div class="button-grid">
          <button class="choice-button active" type="button">indeed</button>
          <button class="choice-button" type="button">X Work</button>
          <button class="choice-button" type="button">フレックスジョブ</button>
          <button class="choice-button" type="button">ドラピタ</button>
          <button class="choice-button" type="button">ドラEVER</button>
          <button class="choice-button" type="button">求人ボックス</button>
        </div>
        <input type="text" class="text-input" placeholder="その他(自由記述)" />
      </div>

      <div class="question">
        <p><span class="q-number">2</span>地域</p>
        <select class="select-input">
          <option>都道府県</option>
          <option>東京都</option>
          <option>大阪府</option>
          <option>愛知県</option>
          <option>福岡県</option>
        </select>
      </div>

      <div class="question">
        <p><span class="q-number">3</span>何の配送がメインか</p>
        <div class="button-column">
          <button class="choice-button active" type="button">宅配(amazon,大和、佐川、郵便局)</button>
          <button class="choice-button" type="button">企業配(フクスカ、カウネット)</button>
          <button class="choice-button" type="button">チャーター</button>
          <button class="choice-button" type="button">スポット</button>
        </div>
      </div>

      <a class="line-button" href="#">結果をLINEで確認！</a>
    </section>

    <section class="strength image-section">
      <img src="assets/strength.svg" alt="ガチキャリアの強み" />
    </section>

    <div class="bottom-cta-wrap">
      <a class="line-button" href="#">結果をLINEで確認！</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
